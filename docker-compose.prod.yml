services:
  # Proveedor autónomo de PO-Tokens BotGuard (100% Anónimo, sin cuentas ni cookies)
  pot_provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: dlw_pot_provider
    restart: always
    networks:
      - dlw_net

  app_backend:
    build:
      context: ./backend-dlw
      dockerfile: Dockerfile
    container_name: dlw_api
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - POT_PROVIDER_URL=http://dlw_pot_provider:4416
      - COOKIES_PATH=/app/cookies/cookies.txt
      - PROXY_URL=${PROXY_URL:-}
    volumes:
      - ./cookies:/app/cookies:ro
    depends_on:
      - pot_provider
    # No exponemos puertos en el host en producción; Nginx se conecta vía la red externa
    networks:
      - dlw_net
      - nginx-proxy-net

networks:
  dlw_net:
    driver: bridge
  nginx-proxy-net:
    external: true
