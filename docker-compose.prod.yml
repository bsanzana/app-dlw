services:
  # Proveedor autónomo de PO-Tokens BotGuard (100% Anónimo, sin cuentas ni cookies)
  pot_provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: dlw_pot_provider
    restart: always
    networks:
      - dlw_net

  # Motor de respaldo Cobalt (última versión estable) solo en red interna
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: dlw_cobalt
    init: true
    restart: always
    environment:
      - API_URL=http://dlw_cobalt:9000/
      - API_PORT=9000
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dlw_net

  app_backend:
    build:
      context: ./backend-dlw
      dockerfile: Dockerfile
    container_name: dlw_api
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - POT_PROVIDER_URL=http://dlw_pot_provider:4416
      - COBALT_API_URL=${COBALT_API_URL:-http://dlw_cobalt:9000}
      - ENABLE_COBALT=${ENABLE_COBALT:-true}
      - ENABLE_GALLERY_DL=${ENABLE_GALLERY_DL:-true}
      - COOKIES_PATH=/app/cookies/cookies.txt
      - PROXY_URL=${PROXY_URL:-}
      - MAX_DOWNLOADS_PER_IP_DAY=${MAX_DOWNLOADS_PER_IP_DAY:-2}
      - MAX_DOWNLOAD_SIZE_MB=${MAX_DOWNLOAD_SIZE_MB:-500}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./cookies:/app/cookies:ro
    depends_on:
      - pot_provider
      - cobalt
    deploy:
      resources:
        limits:
          memory: 1024M
    # No exponemos puertos en el host en producción; Nginx se conecta vía la red externa
    networks:
      - dlw_net
      - nginx-proxy-net

networks:
  dlw_net:
    driver: bridge
  nginx-proxy-net:
    external: true
