services:
  backend:
    build:
      context: ./backend-dlw
      dockerfile: Dockerfile.dev
    container_name: app-dlw-backend-dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - ./backend-dlw:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-dlw
      dockerfile: Dockerfile.dev
    container_name: app-dlw-frontend-dev
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_API_URL=http://localhost:3001
      - ASTRO_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend-dlw:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
