services:
  pot_provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: dlw_pot_provider_dev
    restart: unless-stopped

  backend:
    build:
      context: ./backend-dlw
      dockerfile: Dockerfile.dev
    container_name: dlw_api_dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - POT_PROVIDER_URL=http://pot_provider:4416
      - COOKIES_PATH=/app/cookies/cookies.txt
      - PROXY_URL=${PROXY_URL:-}
      - MAX_DOWNLOADS_PER_IP_DAY=${MAX_DOWNLOADS_PER_IP_DAY:-2}
      - MAX_DOWNLOAD_SIZE_MB=${MAX_DOWNLOAD_SIZE_MB:-500}
    depends_on:
      - pot_provider
    volumes:
      - ./backend-dlw:/app
      - ./cookies:/app/cookies:ro
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-dlw
      dockerfile: Dockerfile.dev
    container_name: dlw_client_dev
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_API_URL=http://localhost:3001/api
      - ASTRO_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend-dlw:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
