services:
  backend:
    build:
      context: ./backend-dlw
      dockerfile: Dockerfile
    container_name: app-dlw-backend-prod
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./frontend-dlw
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_URL=https://api.dlw.sanzanadev.cl
    container_name: app-dlw-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
